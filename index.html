<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover: 노치·홈 바 영역까지 그리고 env(safe-area-inset-*)로 피한다
      interactive-widget=resizes-content: 안드로이드 크롬에서 키보드가 뜨면 화면 높이를 줄여 하단 고정 요소가 키보드 위로 온다
      확대는 막지 않는다 (접근성)
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>LovablePet</title>
    <!-- 로고의 강아지 얼굴. 아이폰 홈 화면 아이콘은 투명이 안 돼서 크림색 바탕을 깔았다 -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
