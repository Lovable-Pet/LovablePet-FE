name: CI

# develop·main 에 푸시하거나 PR 을 올리면 코드 검사(oxlint)와 빌드(tsc + vite)를 돌린다.
# 배포(CD)는 버셀이 GitHub 에 연결돼 따로 한다 (develop 푸시 → 운영 배포, PR → 미리보기 주소)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
